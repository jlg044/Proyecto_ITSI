services:
  # ==================================
  # INFRAESTRUCTURA BASE
  # ==================================

  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: task-manager-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-taskdb}
    ports:
      - "5433:5432"

  # RabbitMQ Message Broker
  mq:
    image: rabbitmq:3-management-alpine
    container_name: task-manager-mq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n
    container_name: task-manager-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - ./.env
    environment:
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_TUNNEL_URL=http://localhost:${N8N_PORT:-5678}/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mq

  # ==================================
  # APLICACIÓN
  # ==================================

  # API Web Service (Flask)
  web:
    build: ./web
    container_name: task-manager-web
    ports:
      - "5001:5000"
    volumes:
      - ./web:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-taskdb}
      - RABBITMQ_URL=amqp://guest:guest@mq:5672/%2F
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
    depends_on:
      - db
      - mq

  # Worker Service (Async Consumer)
  worker:
    build: ./worker
    container_name: task-manager-worker
    volumes:
      - ./worker:/app
    environment:
      - RABBITMQ_URL=amqp://guest:guest@mq:5672/%2F
    depends_on:
      - mq
  # Notifier Service
  # notifier:
  #   build: ./notifier
  #   container_name: task-manager-notifier
  #   environment:
  #     - RABBITMQ_URL=amqp://guest:guest@mq:5672/%2F
  #     - WEBHOOK_URL=${WEBHOOK_URL:-}
  #     - GMAIL_USER=${GMAIL_USER:-}
  #     - GMAIL_PASSWORD=${GMAIL_PASSWORD:-}
  #   depends_on:
  #     - mq

  # ==================================
  # VOLÚMENES
  # ==================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  n8n_data:
    external: true

# ==================================
# REDES
# ==================================
networks:
  default:
    name: task-manager-network
    driver: bridge
